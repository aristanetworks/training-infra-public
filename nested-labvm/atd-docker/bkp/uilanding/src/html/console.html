<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console - {{ topo_title }}</title>
  <!-- Minimal CSS - avoid anything that could affect xterm measurements -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    #terminal {
      width: 100%;
      height: 100vh;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      font-family: sans-serif;
    }
    .overlay.hidden { display: none; }
    .overlay-content { text-align: center; padding: 40px; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #0066cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-btn {
      padding: 8px 16px;
      border: 1px solid #444;
      background: #0066cc;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      margin: 4px;
      text-decoration: none;
    }
  </style>
  <!-- xterm.js - minimal setup -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
</head>

<body>
  <!-- Terminal - directly in body, no wrappers that could affect measurements -->
  <div id="terminal"></div>

  <!-- Connecting overlay -->
  <div class="overlay" id="connectingOverlay">
    <div class="overlay-content">
      <div class="spinner"></div>
      <h2>Connecting to console...</h2>
      <p id="connectingDevice">-</p>
    </div>
  </div>

  <!-- Error overlay -->
  <div class="overlay hidden" id="errorOverlay">
    <div class="overlay-content">
      <div class="error-icon">&#10060;</div>
      <h2>Connection Failed</h2>
      <p id="errorMessage">Unable to connect to console</p>
      <button class="overlay-btn primary" id="retryBtn">Retry</button>
    </div>
  </div>

  <!-- No device overlay (shown when accessed directly without device parameter) -->
  <div class="overlay hidden" id="noDeviceOverlay">
    <div class="overlay-content">
      <h2>No Device Selected</h2>
      <p>Please access the console through the Terminal page</p>
      <a href="/terminal" class="overlay-btn primary">Go to Terminal Page</a>
    </div>
  </div>

  <!-- Cloud Logging + Console Manager JavaScript -->
  <script src="/js/cloud-log.js"></script>
  <script src="/js/console-manager.min.js"></script>
</body>

</html>
