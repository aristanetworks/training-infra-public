#cloud-config
# Cloud-init template for Debian 12 LXDE Linux Host
#
# Variables replaced at runtime:
#   {hostname}      - VM hostname
#   {mgmt_ip}       - Management IP (eth0, for SSH/VNC access)
#   {gateway}       - Default gateway (192.168.0.1)
#   {password_hash} - SHA-512 hashed password
#   {eth1_config}   - Optional eth1 configuration (data interface)
#
# Interface mapping:
#   eth0 - Management interface (vmgmt bridge, gets pool IP)
#   eth1 - Data interface (OVS bridge to switch, user-configured IP)

hostname: {hostname}
fqdn: {hostname}.atl.local
manage_etc_hosts: true

# Enable SSH password authentication
ssh_pwauth: true

# Create arista user with sudo access
users:
  - name: arista
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    # Password hash generated with: mkpasswd -m sha-512 "arista"
    passwd: {password_hash}
    ssh_authorized_keys: []

# Set timezone
timezone: UTC

# Network configuration
# eth0: Management interface (vmgmt bridge) - always configured
# eth1: Data interface (OVS bridge) - optional, configured via {eth1_config}
network:
  version: 2
  ethernets:
    eth0:
      addresses:
        - {mgmt_ip}/24
      routes:
        - to: default
          via: {gateway}
      nameservers:
        addresses:
          - 8.8.8.8
          - 192.168.0.1
{eth1_config}

# Note: No 'packages:' section - Linux hosts have no internet access
# All required packages must be pre-installed in the base image:
#   openssh-server, iperf3, tcpdump, mtr, traceroute, firefox-esr,
#   net-tools, iputils-ping, dnsutils, x11vnc, lightdm, lxde

# Write x11vnc systemd service file (may not exist in base image)
write_files:
  - path: /etc/systemd/system/x11vnc.service
    content: |
      [Unit]
      Description=x11vnc VNC Server for noVNC
      After=lightdm.service
      Requires=lightdm.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/x11vnc -display :0 -auth guess -forever -loop -noxdamage -repeat -rfbport 5900 -shared
      Restart=on-failure
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'
  - path: /etc/lightdm/lightdm.conf.d/50-autologin.conf
    content: |
      [Seat:*]
      autologin-user=arista
      autologin-user-timeout=0
    permissions: '0644'

# Commands to run on first boot
runcmd:
  # Ensure lightdm config directory exists
  - mkdir -p /etc/lightdm/lightdm.conf.d
  # Reload systemd to pick up new service file
  - systemctl daemon-reload
  # Enable and start SSH server for remote access
  - systemctl enable ssh
  - systemctl start ssh
  # Ensure display manager starts
  - systemctl enable lightdm
  - systemctl start lightdm
  # Start VNC server for noVNC access (x11vnc running on display :0)
  - systemctl enable x11vnc
  - systemctl start x11vnc

# Final message
final_message: "ATL Linux Host {hostname} is ready. Boot time: $UPTIME seconds."
