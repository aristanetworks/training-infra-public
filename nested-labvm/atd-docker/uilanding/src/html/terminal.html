<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal - {{ topo_title }}</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/typography.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }

    .terminal-container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .device-sidebar {
      width: 240px;
      min-width: 240px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      background: #0f3460;
      border-bottom: 1px solid #1a1a2e;
    }

    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .sidebar-header .back-link {
      font-size: 12px;
      color: #888;
      text-decoration: none;
    }

    .sidebar-header .back-link:hover {
      color: #4da8da;
    }

    .device-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .device-group {
      margin-bottom: 4px;
    }

    .group-header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .group-header:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .group-header .arrow {
      margin-right: 8px;
      transition: transform 0.2s;
      font-size: 10px;
    }

    .group-header.collapsed .arrow {
      transform: rotate(-90deg);
    }

    .group-devices {
      display: block;
    }

    .group-devices.hidden {
      display: none;
    }

    .device-item {
      display: flex;
      align-items: center;
      padding: 6px 16px 6px 32px;
      cursor: pointer;
      font-size: 13px;
      color: #ccc;
      transition: background 0.15s;
    }

    .device-item:hover {
      background: rgba(77, 168, 218, 0.15);
    }

    .device-item.connected {
      color: #4da8da;
    }

    .device-item .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 8px;
      background: transparent;
    }

    .device-item.connected .status-dot {
      background: #4ade80;
    }

    .device-item .device-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-item .device-ip {
      font-size: 11px;
      color: #666;
      margin-left: 8px;
    }

    /* Credentials panel */
    .credentials-panel {
      padding: 12px 16px;
      background: #0f3460;
      border-top: 1px solid #1a1a2e;
      font-size: 12px;
    }

    .credentials-panel .label {
      color: #888;
      margin-bottom: 4px;
    }

    .credentials-panel .value {
      color: #4ade80;
      font-family: monospace;
      font-size: 13px;
    }

    /* Main content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Tab bar */
    .tab-bar {
      display: flex;
      align-items: center;
      background: #0f3460;
      border-bottom: 1px solid #16213e;
      height: 40px;
      padding: 0 8px;
      overflow-x: auto;
    }

    .tab-bar::-webkit-scrollbar {
      height: 4px;
    }

    .tab-bar::-webkit-scrollbar-thumb {
      background: #4da8da;
      border-radius: 2px;
    }

    .tab {
      display: flex;
      align-items: center;
      padding: 0 12px;
      height: 32px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      margin-right: 4px;
      cursor: pointer;
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .tab:hover {
      background: #1a1a2e;
      color: #ccc;
    }

    .tab.active {
      background: #1a1a2e;
      color: #fff;
      border-color: #4da8da;
      border-bottom: 1px solid #1a1a2e;
    }

    .tab .tab-name {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab .close-btn {
      margin-left: 8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      color: #666;
    }

    .tab .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .tab-placeholder {
      flex: 1;
    }

    .topology-toggle {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid #4da8da;
      border-radius: 4px;
      color: #4da8da;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
    }

    .topology-toggle:hover {
      background: rgba(77, 168, 218, 0.15);
    }

    .topology-toggle.active {
      background: #4da8da;
      color: #fff;
    }

    /* Terminal area - flex container for terminals and side panels */
    .terminal-area {
      flex: 1;
      display: flex;
      background: #1a1a2e;
      overflow: hidden;
    }

    /* Terminal frames container */
    .terminal-frames {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .terminal-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .terminal-frame.active {
      display: block;
    }

    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #666;
    }

    .empty-state h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #888;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* Side panel (shared styles for topology and labguides) */
    .side-panel {
      width: 50%;
      max-width: 600px;
      min-width: 300px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: none;
      flex-direction: column;
    }

    .side-panel.visible {
      display: flex;
    }

    .side-panel-header {
      padding: 12px 16px;
      background: #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .side-panel-header h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .side-panel-close {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
    }

    .side-panel-close:hover {
      color: #fff;
    }

    .side-panel-content {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Topology panel */
    .topology-panel .side-panel-content {
      padding: 16px;
    }

    .topology-panel .side-panel-content img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Lab guides panel */
    .labguides-panel .side-panel-content {
      padding: 0;
    }

    .labguides-panel .side-panel-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Panel toggle buttons */
    .panel-toggle {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid #4da8da;
      border-radius: 4px;
      color: #4da8da;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
      white-space: nowrap;
    }

    .panel-toggle:hover {
      background: rgba(77, 168, 218, 0.15);
    }

    .panel-toggle.active {
      background: #4da8da;
      color: #fff;
    }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
    }

    .loading::after {
      content: '';
      width: 24px;
      height: 24px;
      border: 2px solid #4da8da;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="terminal-container">
    <!-- Device Sidebar -->
    <aside class="device-sidebar">
      <div class="sidebar-header">
        <h1>{{ topo_title }}</h1>
        <a href="/" class="back-link">&larr; Back to Home</a>
      </div>
      <div class="device-tree" id="deviceTree">
        <div class="loading">Loading devices</div>
      </div>
      <div class="credentials-panel">
        <div class="label">Username: <span class="value">arista</span></div>
        <div class="label">Password: <span class="value">{{ ARISTA_PWD }}</span></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Tab Bar -->
      <div class="tab-bar" id="tabBar">
        <div class="tab-placeholder"></div>
        <button class="panel-toggle" id="labguidesToggle">Lab Guides</button>
        <button class="panel-toggle" id="topoToggle">Topology</button>
      </div>

      <!-- Terminal Area -->
      <div class="terminal-area" id="terminalArea">
        <!-- Terminal Frames Container -->
        <div class="terminal-frames" id="terminalFrames">
          <div class="empty-state" id="emptyState">
            <h2>No terminals open</h2>
            <p>Click a device on the left to open a terminal</p>
          </div>
        </div>

        <!-- Lab Guides Panel -->
        <div class="side-panel labguides-panel" id="labguidesPanel">
          <div class="side-panel-header">
            <h3>Lab Guides</h3>
            <button class="side-panel-close" id="labguidesClose">&times;</button>
          </div>
          <div class="side-panel-content">
            <iframe src="/labguides/index.html" title="Lab Guides"></iframe>
          </div>
        </div>

        <!-- Topology Panel -->
        <div class="side-panel topology-panel" id="topologyPanel">
          <div class="side-panel-header">
            <h3>Topology Diagram</h3>
            <button class="side-panel-close" id="topoClose">&times;</button>
          </div>
          <div class="side-panel-content">
            <img src="/topo/atd-topo.png" alt="Topology Diagram" />
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Terminal Tab Manager
    const TerminalManager = {
      tabs: [],
      activeTabId: null,

      init() {
        this.loadDevices();
        this.setupPanelToggles();
      },

      async loadDevices() {
        try {
          const response = await fetch('/td-api/devices');
          const data = await response.json();
          this.renderDeviceTree(data.groups);
        } catch (error) {
          console.error('Failed to load devices:', error);
          document.getElementById('deviceTree').innerHTML =
            '<div class="loading" style="color: #e74c3c;">Failed to load devices</div>';
        }
      },

      renderDeviceTree(groups) {
        const tree = document.getElementById('deviceTree');
        tree.innerHTML = '';

        groups.forEach(group => {
          const groupEl = document.createElement('div');
          groupEl.className = 'device-group';

          const headerEl = document.createElement('div');
          headerEl.className = 'group-header';
          headerEl.innerHTML = `<span class="arrow">&#9660;</span>${group.group}`;

          const devicesEl = document.createElement('div');
          devicesEl.className = 'group-devices';

          group.devices.forEach(device => {
            const deviceEl = document.createElement('div');
            deviceEl.className = 'device-item';
            deviceEl.dataset.ip = device.ip;
            deviceEl.dataset.name = device.name;
            deviceEl.innerHTML = `
              <span class="status-dot"></span>
              <span class="device-name">${device.name}</span>
              <span class="device-ip">${device.ip}</span>
            `;
            deviceEl.addEventListener('click', () => this.openTerminal(device.name, device.ip));
            devicesEl.appendChild(deviceEl);
          });

          headerEl.addEventListener('click', () => {
            headerEl.classList.toggle('collapsed');
            devicesEl.classList.toggle('hidden');
          });

          groupEl.appendChild(headerEl);
          groupEl.appendChild(devicesEl);
          tree.appendChild(groupEl);
        });
      },

      openTerminal(name, ip) {
        // Check if tab already exists
        const existingTab = this.tabs.find(t => t.ip === ip);
        if (existingTab) {
          this.activateTab(existingTab.id);
          return;
        }

        // Create new tab
        const tabId = 'tab-' + Date.now();
        const tab = { id: tabId, name, ip };
        this.tabs.push(tab);

        // Create tab element
        const tabBar = document.getElementById('tabBar');
        const placeholder = tabBar.querySelector('.tab-placeholder');

        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.id = tabId;
        tabEl.innerHTML = `
          <span class="tab-name">${name}</span>
          <span class="close-btn" title="Close">&times;</span>
        `;

        tabEl.querySelector('.tab-name').addEventListener('click', () => this.activateTab(tabId));
        tabEl.querySelector('.close-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          this.closeTab(tabId);
        });

        tabBar.insertBefore(tabEl, placeholder);

        // Create iframe
        const terminalFrames = document.getElementById('terminalFrames');
        const iframe = document.createElement('iframe');
        iframe.className = 'terminal-frame';
        iframe.id = 'frame-' + tabId;
        iframe.src = `/ssh/host/${ip}`;
        terminalFrames.appendChild(iframe);

        // Mark device as connected
        this.updateDeviceStatus(ip, true);

        // Activate the new tab
        this.activateTab(tabId);

        // Hide empty state
        document.getElementById('emptyState').style.display = 'none';
      },

      activateTab(tabId) {
        // Deactivate all tabs
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.terminal-frame').forEach(f => f.classList.remove('active'));

        // Activate selected tab
        const tabEl = document.getElementById(tabId);
        const frameEl = document.getElementById('frame-' + tabId);

        if (tabEl) tabEl.classList.add('active');
        if (frameEl) frameEl.classList.add('active');

        this.activeTabId = tabId;
      },

      closeTab(tabId) {
        const tabIndex = this.tabs.findIndex(t => t.id === tabId);
        if (tabIndex === -1) return;

        const tab = this.tabs[tabIndex];

        // Remove tab element
        const tabEl = document.getElementById(tabId);
        if (tabEl) tabEl.remove();

        // Remove iframe
        const frameEl = document.getElementById('frame-' + tabId);
        if (frameEl) frameEl.remove();

        // Update device status
        this.updateDeviceStatus(tab.ip, false);

        // Remove from tabs array
        this.tabs.splice(tabIndex, 1);

        // Activate another tab or show empty state
        if (this.tabs.length > 0) {
          const newActiveIndex = Math.min(tabIndex, this.tabs.length - 1);
          this.activateTab(this.tabs[newActiveIndex].id);
        } else {
          this.activeTabId = null;
          document.getElementById('emptyState').style.display = 'block';
        }
      },

      updateDeviceStatus(ip, connected) {
        const deviceEl = document.querySelector(`.device-item[data-ip="${ip}"]`);
        if (deviceEl) {
          deviceEl.classList.toggle('connected', connected);
        }
      },

      setupPanelToggles() {
        // Topology panel
        const topoToggle = document.getElementById('topoToggle');
        const topoPanel = document.getElementById('topologyPanel');
        const topoClose = document.getElementById('topoClose');

        // Lab guides panel
        const labguidesToggle = document.getElementById('labguidesToggle');
        const labguidesPanel = document.getElementById('labguidesPanel');
        const labguidesClose = document.getElementById('labguidesClose');

        // Toggle topology panel
        topoToggle.addEventListener('click', () => {
          const isVisible = topoPanel.classList.toggle('visible');
          topoToggle.classList.toggle('active', isVisible);
          // Close labguides if opening topology
          if (isVisible) {
            labguidesPanel.classList.remove('visible');
            labguidesToggle.classList.remove('active');
          }
        });

        topoClose.addEventListener('click', () => {
          topoPanel.classList.remove('visible');
          topoToggle.classList.remove('active');
        });

        // Toggle lab guides panel
        labguidesToggle.addEventListener('click', () => {
          const isVisible = labguidesPanel.classList.toggle('visible');
          labguidesToggle.classList.toggle('active', isVisible);
          // Close topology if opening labguides
          if (isVisible) {
            topoPanel.classList.remove('visible');
            topoToggle.classList.remove('active');
          }
        });

        labguidesClose.addEventListener('click', () => {
          labguidesPanel.classList.remove('visible');
          labguidesToggle.classList.remove('active');
        });
      }
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      TerminalManager.init();
    });
  </script>
</body>

</html>
