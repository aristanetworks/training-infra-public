<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console - {{ topo_title }}</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/typography.css" />
  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--proxima);
      background: #000;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }

    .console-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Terminal - full height when embedded in iframe */
    .terminal-wrapper {
      flex: 1;
      padding: 4px;
      background: #000;
      overflow: hidden;
    }

    #terminal {
      width: 100%;
      height: 100%;
    }

    /* Connection states */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-content {
      text-align: center;
      padding: 40px;
    }

    .overlay-content h2 {
      margin-bottom: 16px;
      color: #fff;
    }

    .overlay-content p {
      color: #888;
      margin-bottom: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #0066cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .overlay-btn {
      padding: 8px 16px;
      border: 1px solid #444;
      background: transparent;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      margin: 4px;
    }

    .overlay-btn:hover {
      background: #333;
      border-color: #666;
    }

    .overlay-btn.primary {
      background: #0066cc;
      border-color: #0066cc;
      color: #fff;
    }

    .overlay-btn.primary:hover {
      background: #0055aa;
    }
  </style>
</head>

<body>
  <div class="console-container">
    <!-- Terminal - full screen for iframe embedding -->
    <div class="terminal-wrapper">
      <div id="terminal"></div>
    </div>
  </div>

  <!-- Connecting overlay -->
  <div class="overlay" id="connectingOverlay">
    <div class="overlay-content">
      <div class="spinner"></div>
      <h2>Connecting to console...</h2>
      <p id="connectingDevice">-</p>
    </div>
  </div>

  <!-- Error overlay -->
  <div class="overlay hidden" id="errorOverlay">
    <div class="overlay-content">
      <div class="error-icon">&#10060;</div>
      <h2>Connection Failed</h2>
      <p id="errorMessage">Unable to connect to console</p>
      <button class="overlay-btn primary" id="retryBtn">Retry</button>
    </div>
  </div>

  <!-- No device overlay (shown when accessed directly without device parameter) -->
  <div class="overlay hidden" id="noDeviceOverlay">
    <div class="overlay-content">
      <h2>No Device Selected</h2>
      <p>Please access the console through the Terminal page</p>
      <a href="/terminal" class="overlay-btn primary">Go to Terminal Page</a>
    </div>
  </div>

  <script>
    // Console Manager - Simplified for iframe embedding
    const ConsoleManager = {
      term: null,
      ws: null,
      fitAddon: null,
      currentDevice: null,
      reconnectAttempts: 0,
      maxReconnectAttempts: 3,

      init() {
        // Initialize xterm.js
        this.term = new Terminal({
          cursorBlink: true,
          cursorStyle: 'block',
          fontFamily: "'Monaco', 'Menlo', 'Ubuntu Mono', monospace",
          fontSize: 14,
          lineHeight: 1.2,
          theme: {
            background: '#000000',
            foreground: '#ffffff',
            cursor: '#ffffff',
            cursorAccent: '#000000',
            selectionBackground: '#3a3d41',
          },
          allowProposedApi: true
        });

        this.fitAddon = new FitAddon.FitAddon();
        const webLinksAddon = new WebLinksAddon.WebLinksAddon();

        this.term.loadAddon(this.fitAddon);
        this.term.loadAddon(webLinksAddon);

        this.term.open(document.getElementById('terminal'));
        this.fitAddon.fit();

        // Handle terminal resize
        window.addEventListener('resize', () => this.handleResize());

        // Setup retry button handler
        document.getElementById('retryBtn').addEventListener('click', () => {
          if (this.currentDevice) {
            document.getElementById('errorOverlay').classList.add('hidden');
            this.connect(this.currentDevice);
          }
        });

        // Check URL for device parameter
        const urlParams = new URLSearchParams(window.location.search);
        const device = urlParams.get('device');

        if (device) {
          this.connect(device);
        } else {
          // No device specified - show redirect to terminal page
          document.getElementById('connectingOverlay').classList.add('hidden');
          document.getElementById('noDeviceOverlay').classList.remove('hidden');
        }
      },

      async connect(device) {
        this.currentDevice = device;
        this.reconnectAttempts++;

        // Update UI
        document.getElementById('connectingDevice').textContent = device;
        document.getElementById('connectingOverlay').classList.remove('hidden');
        document.getElementById('errorOverlay').classList.add('hidden');
        document.getElementById('noDeviceOverlay').classList.add('hidden');

        // Close existing connection if any
        if (this.ws) {
          this.ws.close();
          this.ws = null;
        }

        // Clear terminal
        this.term.clear();
        this.term.write('\x1b[2J\x1b[H'); // Clear screen and move cursor home
        this.term.write(`Connecting to ${device}...\r\n`);

        try {
          // Build WebSocket URL
          const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${wsProtocol}//${window.location.host}/console-api/ws/console/${device}`;

          this.ws = new WebSocket(wsUrl);
          this.ws.binaryType = 'arraybuffer';

          this.ws.onopen = () => {
            console.log('WebSocket connected');
            document.getElementById('connectingOverlay').classList.add('hidden');
            this.reconnectAttempts = 0;

            // Send initial resize
            this.sendResize();

            // Focus terminal
            this.term.focus();
          };

          this.ws.onmessage = (event) => {
            if (event.data instanceof ArrayBuffer) {
              const decoder = new TextDecoder();
              this.term.write(decoder.decode(event.data));
            } else {
              this.term.write(event.data);
            }
          };

          this.ws.onclose = (event) => {
            console.log('WebSocket closed:', event.code, event.reason);

            if (event.code !== 1000 && event.code !== 1001) {
              // Abnormal close
              if (this.reconnectAttempts < this.maxReconnectAttempts) {
                this.term.write('\r\n\x1b[33mConnection lost. Attempting to reconnect...\x1b[0m\r\n');
                setTimeout(() => this.connect(device), 2000);
              } else {
                this.showError('Connection lost after multiple attempts');
              }
            } else {
              this.term.write('\r\n\x1b[33mConnection closed.\x1b[0m\r\n');
            }
          };

          this.ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            document.getElementById('connectingOverlay').classList.add('hidden');
            this.showError('Failed to connect to console service');
          };

          // Handle terminal input
          this.term.onData((data) => {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
              this.ws.send(data);
            }
          });

        } catch (error) {
          console.error('Connection error:', error);
          document.getElementById('connectingOverlay').classList.add('hidden');
          this.showError(error.message || 'Failed to establish connection');
        }
      },

      handleResize() {
        if (this.fitAddon) {
          this.fitAddon.fit();
          this.sendResize();
        }
      },

      sendResize() {
        if (this.ws && this.ws.readyState === WebSocket.OPEN && this.term) {
          const resizeMsg = JSON.stringify({
            type: 'resize',
            cols: this.term.cols,
            rows: this.term.rows
          });
          this.ws.send(resizeMsg);
        }
      },

      showError(message) {
        document.getElementById('errorMessage').textContent = message;
        document.getElementById('errorOverlay').classList.remove('hidden');
      }
    };

    // Initialize on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      ConsoleManager.init();
    });
  </script>
</body>

</html>
