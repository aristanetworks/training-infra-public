<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console - {{ topo_title }}</title>
  <!-- Base styles -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/typography.css" />
  <link rel="stylesheet" href="/css/console.css" />
  <!-- JetBrains Mono webfont for consistent terminal rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
</head>

<body>
  <div class="console-container">
    <!-- Terminal - full screen for iframe embedding -->
    <div class="terminal-wrapper">
      <div id="terminal"></div>
    </div>
  </div>

  <!-- Connecting overlay -->
  <div class="overlay" id="connectingOverlay">
    <div class="overlay-content">
      <div class="spinner"></div>
      <h2>Connecting to console...</h2>
      <p id="connectingDevice">-</p>
    </div>
  </div>

  <!-- Error overlay -->
  <div class="overlay hidden" id="errorOverlay">
    <div class="overlay-content">
      <div class="error-icon">&#10060;</div>
      <h2>Connection Failed</h2>
      <p id="errorMessage">Unable to connect to console</p>
      <button class="overlay-btn primary" id="retryBtn">Retry</button>
    </div>
  </div>

  <!-- No device overlay (shown when accessed directly without device parameter) -->
  <div class="overlay hidden" id="noDeviceOverlay">
    <div class="overlay-content">
      <h2>No Device Selected</h2>
      <p>Please access the console through the Terminal page</p>
      <a href="/terminal" class="overlay-btn primary">Go to Terminal Page</a>
    </div>
  </div>

  <!-- Console Manager JavaScript -->
  <script src="/js/console-manager.js"></script>
</body>

</html>
