<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/cloud-log.js"></script>
    <script type="module" src="https://unpkg.com/@honorlock/integration-sdk-js?module"></script>
    <script type="module" src="js/exam-session-guard.js"></script>
    <script type="module" src="js/honorlock-common.js"></script>
    <script type="module" src="js/honorlock-backend-v1.js"></script>
    <script type="module" src="js/honorlock-examsubmit-v1.js"></script>

    <title>Honorlock Authentication</title>

    <script type="module">
        // Import and initialize exam session guard
        import ExamSessionGuard from './js/exam-session-guard.js';

        // Check if exam is already running in another tab
        const sessionGuard = new ExamSessionGuard();

        // On page load, check for existing sessions
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionGuard.checkAndRedirect()) {
                // Exam is running elsewhere, will redirect automatically
                return;
            }

            // Start exam session
            if (sessionGuard.startExamSession()) {
                console.log('Exam session started successfully');

                // Make sessionGuard available globally for exam submission
                window.examSessionGuard = sessionGuard;
            } else {
                console.error('Failed to start exam session');
                window.location.href = '/exam-already-running';
            }
        });

        // End session when exam is submitted
        window.addEventListener('examSubmitted', () => {
            if (window.examSessionGuard) {
                window.examSessionGuard.endExamSession();
            }
        });
    </script>

</head>


<body>
    <Honorlock></Honorlock>
    <iframe id="honer-iframe" src="https://app.honorlock.com/install/extension?locale=en"
        style="width: 100vw; height: 100vh; border: none; margin: 0; padding: 0;"></iframe>
</body>

</html>
