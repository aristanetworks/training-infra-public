#cloud-config
# VeloCloud Gateway Cloud-Init Template
#
# Gateway serves as data plane hub for Edge traffic aggregation.
# Requires VCO registration with activation key for production use.
#
# Variables replaced at runtime:
#   {hostname}         - VM hostname (RFC 1123 compliant)
#   {password}         - Console password for vcadmin user
#   {vco}              - VeloCloud Orchestrator address (FQDN or IP)
#   {activation_code}  - Gateway activation key from VCO
#
# Network variables (configured via separate network-config):
#   {eth0_ip}          - Public/internet-facing IP with CIDR (e.g., 192.168.0.50/24)
#   {eth0_gateway}     - Default gateway for eth0
#   {eth1_ip}          - Handoff/Management VRF IP with CIDR
#   {eth1_gateway}     - Gateway for eth1 (optional, for MGMT VRF routing)
#
# Interface mapping (per VeloCloud Gateway specs):
#   eth0 - Public/internet-facing interface (primary, untagged)
#          Used for VCO communication and Edge VCMP tunnels
#   eth1 - Handoff/private interface (connects to PE router)
#          Supports VLAN tagging (802.1Q, QinQ) for customer handoff
#
# Firewall requirements (if Gateway behind firewall/NAT):
#   - Outbound: TCP/443 to Orchestrator
#   - Inbound: UDP/2426 (VCMP), UDP/4500, UDP/500, IP/50 (ESP if no NAT)
#
# Default credentials: vcadmin / {password}
#
# Note: VeloCloud cloud-init expects plain text password, not YAML-quoted.
# Use {password_raw} for the password field.

hostname: {hostname}
password: {password_raw}
chpasswd: {expire: False}
ssh_pwauth: True
ssh_authorized_keys: []

velocloud:
  vcg:
    vco: {vco}
    activation_code: {activation_code}
    vco_ignore_cert_errors: true
