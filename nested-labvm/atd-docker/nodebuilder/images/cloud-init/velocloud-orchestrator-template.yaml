#cloud-config
# VeloCloud Orchestrator (VCO) Cloud-Init Template
#
# VCO is the management and control plane for VeloCloud SD-WAN.
# Manages Edge and Gateway devices, policies, and configurations.
#
# Variables replaced at runtime:
#   {hostname}         - VM hostname
#   {password}         - Console password for vcadmin user
#
# Interface mapping:
#   eth0 - Management interface (vmgmt bridge) - admin/web access
#   eth1 - Data interface (optional - Edge/Gateway connectivity)
#
# Network configuration is handled via meta-data network-interfaces section.
#
# Resource requirements (production):
#   - 8 vCPUs, 64GB RAM
#   - 4 SSD volumes: Root (192GB), Store (1TB), Store2 (500GB), Store3 (1TB)
#
# For training: Reduced to 4 vCPUs, 8GB RAM with minimal storage
#
# Firewall requirements:
#   - Inbound: TCP/80 (HTTP), TCP/443 (HTTPS)
#   - Outbound: Established connections for updates
#
# Default credentials: vcadmin / {password}
# Web UI: https://<mgmt_ip>/

password: {password}
chpasswd: {expire: False}
ssh_pwauth: True

vco:
  super_users:
    list: |
      admin@velocloud.local:{password_raw}
    remove_default_users: False

