#cloud-config
# Ubuntu Desktop Host Cloud-Init Template
#
# IMPORTANT: This template assumes the base image (ubuntu-desktop-base.qcow2)
# has all required packages pre-installed:
#   - lxde-core, lxde, lightdm (desktop environment)
#   - x11vnc (VNC server for noVNC access)
#   - firefox (web browser)
#   - net-tools, iputils-ping, traceroute, mtr, tcpdump, iperf3 (network tools)
#   - curl, wget, vim, nano, dnsutils (utilities)
#
# Variables replaced at runtime:
#   {hostname}  - VM hostname
#   {username}  - Login username (default: arista)
#   {password}  - Login password
#   {mgmt_ip}   - Management IP address
#   {gateway}   - Default gateway
#
# Interface mapping (Ubuntu uses predictable names):
#   ens3 - Management interface (vmgmt bridge) - first virtio NIC
#   ens4 - Data interface (optional, connects to topology switch) - second virtio NIC
#
# NOTE: Network configuration is in a separate network-config file
# (generated by host_manager.py) which cloud-init processes early.

# Set hostname
hostname: {hostname}
fqdn: {hostname}.atl.local
manage_etc_hosts: true

# Create user with sudo access
users:
  - name: {username}
    groups: [sudo, adm, audio, video, plugdev, netdev]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false

# Set password using users key (preferred method)
chpasswd:
  expire: false
  users:
    - name: {username}
      password: {password}
      type: text

# Write configuration files
write_files:
  # x11vnc systemd service for VNC access
  - path: /etc/systemd/system/x11vnc.service
    content: |
      [Unit]
      Description=x11vnc VNC Server for noVNC
      After=lightdm.service
      Requires=lightdm.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/x11vnc -display :0 -auth guess -forever -loop -noxdamage -repeat -rfbport 5900 -shared -nopw
      Restart=on-failure
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

  # LightDM autologin configuration with LXDE session
  - path: /etc/lightdm/lightdm.conf.d/50-autologin.conf
    content: |
      [Seat:*]
      autologin-user={username}
      autologin-user-timeout=0
      autologin-session=LXDE
      user-session=LXDE
    permissions: '0644'

# Run commands to configure the desktop environment
runcmd:
  # Reload systemd and enable services
  - systemctl daemon-reload
  - systemctl enable x11vnc
  - systemctl enable lightdm
  - systemctl set-default graphical.target
  # Configure LXDE session for the user
  - mkdir -p /home/{username}/.config/lxsession/LXDE
  - |
    cat > /home/{username}/.config/lxsession/LXDE/autostart << 'AUTOSTART'
    @lxpanel --profile LXDE
    @pcmanfm --desktop --profile LXDE
    @xset s off
    @xset -dpms
    @xset s noblank
    AUTOSTART
  - chown -R {username}:{username} /home/{username}/.config
  # Signal completion
  - touch /var/lib/cloud/instance/desktop-setup-complete
  # Start the display manager
  - systemctl start lightdm

# No reboot needed since packages are pre-installed in base image
