map $status $loggable_status {
    ~^[34] 0;
    default 1;
}
map $uri $loggable {
    /login 0;
    default $loggable_status;
}
server {
    listen 80 default_server;
    access_log   /var/log/nginx/access.log ;
    error_log    /var/log/nginx/error.log info ;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate           /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key       /etc/nginx/certs/privkey.pem;
    ssl_session_cache  builtin:1000  shared:SSL:10m;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;
    access_log   /var/log/nginx/atd-access.log combined; 
    error_log    /var/log/nginx/atd-error.log info;      

    location / {
        proxy_pass http://atd-uilanding;
        proxy_http_version 1.1;
        proxy_read_timeout 70;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }
    location /labguides {
        proxy_pass http://atd-labguides;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/html;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /host1 {
        proxy_pass http://192.168.0.1:6001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/html;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /host2 {
        proxy_pass http://192.168.0.1:6002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/html;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /uptime {
        access_log off;
        proxy_pass http://atd-uptime:50010;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
    }
    location /uptimeWithRuntime {
        access_log off;
        proxy_pass http://atd-uilanding/uptimeWithRuntime;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
    }
    location /td-api/ {
        proxy_pass http://atd-uilanding/td-api/;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
    }
    location /jenkins {
        proxy_pass http://atd-jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # === Static Assets for Unified Header ===
    # Note: /js/ is NOT mapped here - it's served by uilanding for app JS files
    # Only specific header-related files are served from nginx
    location /unified-header.js {
        alias /etc/nginx/js/unified-header.js;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /coder/ {
        proxy_pass http://atd-coder:8080/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;

        # === Unified Header Injection ===
        # Modify CSP to allow inline styles for unified header
        sub_filter "style-src 'self'" "style-src 'self' 'unsafe-inline'";
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/html text/plain;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /ssh {
        proxy_pass http://atd-ssh:2222;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/html;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location = /firefox {return 301 $scheme://$http_host/firefox/;}
    location /firefox/ {
        proxy_pass http://atd-webui:5800/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === WebSocket Support Headers ===
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400; # Keep connection open

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/html;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location ~ ^/(grpc-web/arista\..*|arista\..*) {
        grpc_pass grpcs://192.168.0.5:443;
        grpc_ssl_verify off;
        grpc_read_timeout 14400;
        grpc_send_timeout 14400;
        client_body_timeout 14400;
    }
    location ~ ^/(cv|wifi/aware/|grpc-web|cvpservice|static|api|web|assets) {
        proxy_pass https://192.168.0.5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/html;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
  }
