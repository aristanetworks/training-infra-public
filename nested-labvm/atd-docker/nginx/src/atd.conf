map $status $loggable_status {
    ~^[34] 0;
    default 1;
}
map $uri $loggable {
    /login 0;
    default $loggable_status;
}

# UILanding multi-app upstreams (same container, different ports)
upstream atd-ui-frontend { server atd-uilanding:8080; }
upstream atd-api         { server atd-uilanding:8081; }
upstream atd-websocket   { server atd-uilanding:8082; }
upstream atd-exam        { server atd-uilanding:8083; }
upstream atd-proxy-svc   { server atd-uilanding:8084; }

server {
    listen 80 default_server;
    access_log   /var/log/nginx/access.log ;
    error_log    /var/log/nginx/error.log info ;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate           /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key       /etc/nginx/certs/privkey.pem;
    ssl_session_cache  builtin:1000  shared:SSL:10m;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;
    access_log   /var/log/nginx/atd-access.log combined; 
    error_log    /var/log/nginx/atd-error.log info;      

    location / {
        proxy_pass http://atd-ui-frontend;
        proxy_http_version 1.1;
        proxy_read_timeout 70;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        # === Notification Bell Injection ===
        sub_filter '</body>' '<script src="/notification-bell.js"></script></body>';
        sub_filter_once on;
        proxy_set_header Accept-Encoding "";
    }
    location /topology-converter {
        proxy_pass http://atd-ui-frontend/topology-converter;
        proxy_http_version 1.1;
        proxy_read_timeout 70;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_once on;
        proxy_set_header Accept-Encoding "";
    }
    location /labguides {
        proxy_pass http://atd-labguides;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /host1 {
        proxy_pass http://192.168.0.1:6001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /host2 {
        proxy_pass http://192.168.0.1:6002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /uptime {
        access_log off;
        proxy_pass http://atd-uptime:50010;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
    }
    # Feature flags API - returns enabled features for this lab
    location /feature-flags {
        proxy_pass http://atd-configservice:50011/features;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /feature-flags/ {
        proxy_pass http://atd-configservice:50011/features/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Announcements API - returns active announcements for this lab
    # access_log off to prevent periodic polling from interfering with idle detection
    location /announcements {
        access_log off;
        proxy_pass http://atd-configservice:50011/announcements;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /announcements/ {
        access_log off;
        proxy_pass http://atd-configservice:50011/announcements/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Internal announcements API - container-to-container only, not public
    location /internal/announcements {
        # Restrict to Docker internal networks only
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://atd-configservice:50011/internal/announcements;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /internal/announcements/ {
        # Restrict to Docker internal networks only
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://atd-configservice:50011/internal/announcements/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Combined config API - returns both features and announcements
    location /config-api {
        proxy_pass http://atd-configservice:50011/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /uptimeWithRuntime {
        access_log off;
        proxy_pass http://atd-ui-frontend/uptimeWithRuntime;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
    }
    # --- WebSocket service (port 8082) ---
    location = /td-ws {
        proxy_pass http://atd-websocket;
        proxy_http_version 1.1;
        proxy_read_timeout 70;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # --- Capture WebSocket (port 8084) ---
    location = /capture-ws {
        proxy_pass http://atd-proxy-svc;
        proxy_http_version 1.1;
        proxy_read_timeout 3600;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # --- Exam service (port 8083) ---
    location ~ ^/(exam-submitted|exam-already-running|exam-redo|exam-authentication|examStatus|examSubmit|getAccessInfo|getClientId|getExamInstructions|getUserSessionId|beginExam|endExam)$ {
        proxy_pass http://atd-exam;
        proxy_http_version 1.1;
        proxy_read_timeout 70;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    # --- Proxy service (port 8084): nodebuilder, capture, impairments ---
    location /td-api/nodes/ {
        proxy_pass http://atd-proxy-svc;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /td-api/capture/ {
        proxy_pass http://atd-proxy-svc;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /td-api/latency/ {
        proxy_pass http://atd-proxy-svc;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /td-api/impairments/ {
        proxy_pass http://atd-proxy-svc;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # --- UI Frontend (port 8080): client-log, connectivity, topology-converter API ---
    location /td-api/client-log {
        proxy_pass http://atd-ui-frontend;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /td-api/connectivity-status {
        proxy_pass http://atd-ui-frontend;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /td-api/topology-converter {
        return 301 /td-api/topology-converter/;
    }
    location /td-api/topology-converter/ {
        proxy_pass http://atd-ui-frontend;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # --- API service (port 8081): all remaining /td-api/ routes ---
    location /td-api/ {
        proxy_pass http://atd-api;
        proxy_http_version 1.1;
        proxy_read_timeout 30;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /jenkins {
        proxy_pass http://atd-jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Inject unified header into Jenkins HTML
        sub_filter '</head>' '<script src="/unified-header.js"></script></head>';
        sub_filter_once on;
        proxy_set_header Accept-Encoding "";
    }
    # === Static Assets for Unified Header ===
    # Note: /js/ is NOT mapped here - it's served by uilanding for app JS files
    # Only specific header-related files are served from nginx
    location /unified-header.js {
        alias /etc/nginx/js/unified-header.js;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /notification-bell.js {
        alias /etc/nginx/js/notification-bell.js;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /timer-widget.js {
        alias /etc/nginx/js/timer-widget.js;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /cvp-activity.js {
        alias /etc/nginx/js/cvp-activity.js;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /coder/ {
        proxy_pass http://atd-coder:8080/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;

        # === Unified Header Injection ===
        # Modify CSP to allow inline styles for unified header
        sub_filter "style-src 'self'" "style-src 'self' 'unsafe-inline'";
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_types text/plain;
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    location /ssh {
        proxy_pass http://atd-ssh:2222;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        # No sub_filter here: SSH pages load in iframes where the unified header
        # skips initialization. sub_filter also breaks WebSocket/socket.io connections
        # by buffering responses and stripping Accept-Encoding.
        # Strip frame-blocking headers added by WebSSH2 v4.0.1 so terminal
        # pages can load inside iframes on the /terminal page.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
    # Console service API - serial console access to KVM VMs
    # consoleservice runs on host network at port 8095
    # 172.17.0.1 is the docker0 bridge gateway (host) accessible from bridge-networked containers
    # Uses /console-api/ to avoid conflict with /console UI route in uilanding
    location /console-api/ {
        proxy_pass http://172.17.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Nodebuilder API - direct access for frontend components
    # nodebuilder runs on host network at port 8090
    # 172.17.0.1 is the docker0 bridge gateway (host) accessible from bridge-networked containers
    location /nb-api/ {
        proxy_pass http://172.17.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5;
        proxy_read_timeout 120;
    }
    # noVNC - HTML5 VNC client for Linux host desktop access
    # noVNC/websockify runs on host network at port 6080
    # Serves static noVNC files and proxies WebSocket connections to VMs
    location /novnc/ {
        proxy_pass http://172.17.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # WebSocket endpoint for noVNC/websockify VNC proxy
    location /websockify/ {
        proxy_pass http://172.17.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /firefox {return 301 $scheme://$http_host/firefox/;}
    location /firefox/ {
        proxy_pass http://atd-webui:5800/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === WebSocket Support Headers ===
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400; # Keep connection open

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
    # gRPC connectivity health check - excluded from access logging
    # to prevent idle detection interference (atdMonitor reads last nginx log entry)
    location = /td-api/grpc-health {
        access_log off;
        proxy_pass https://192.168.0.5/arista.studio.v1.StudioService/GetAll;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 5;
        proxy_send_timeout 5;
    }
    location ~ ^/(grpc-web/arista\..*|arista\..*) {
        grpc_pass grpcs://192.168.0.5:443;
        grpc_ssl_verify off;
        grpc_read_timeout 14400;
        grpc_send_timeout 14400;
        client_body_timeout 14400;
    }
    location ~ ^/(cv|wifi/aware/|grpc-web|cvpservice|static|api|web|assets) {
        proxy_pass https://192.168.0.5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # === Unified Header Injection ===
        sub_filter '</body>' '<script src="/unified-header.js"></script></body>';
        sub_filter_once off;
        proxy_set_header Accept-Encoding "";
    }
  }
