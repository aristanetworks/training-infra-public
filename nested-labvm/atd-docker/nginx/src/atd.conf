map $status $loggable_status {
    ~^[34] 0;
    default 1;
}
map $uri $loggable {
    /login 0;
    default $loggable_status;
}
server {
    listen 80 default_server;
    access_log   /var/log/nginx/access.log ;
    error_log    /var/log/nginx/error.log info ;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate           /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key       /etc/nginx/certs/privkey.pem;
    ssl_session_cache  builtin:1000  shared:SSL:10m;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;
    access_log   /var/log/nginx/atd-access.log combined; 
    error_log    /var/log/nginx/atd-error.log info;      

    location / {
        proxy_pass http://atd-uilanding;
        proxy_http_version 1.1;
        proxy_read_timeout 70;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }
    location /labguides {
        proxy_pass http://atd-labguides;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }
    location /host1 {
        proxy_pass http://192.168.0.1:6001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
    location /host2 {
        proxy_pass http://192.168.0.1:6002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

    }
    location /uptime {
        access_log off;
        proxy_pass http://atd-uptime:50010;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
    }
    location /jenkins {
        proxy_pass http://atd-jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /coder/ {
        proxy_pass http://atd-coder:8080/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
    location /ssh {
        proxy_pass http://atd-ssh:2222;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
    }
    # Console service API - serial console access to KVM VMs
    # consoleservice runs on host network at port 8095
    # 172.17.0.1 is the docker0 bridge gateway (host) accessible from bridge-networked containers
    # Uses /console-api/ to avoid conflict with /console UI route in uilanding
    location /console-api/ {
        proxy_pass http://172.17.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Nodebuilder API - direct access for frontend components
    # nodebuilder runs on host network at port 8090
    # 172.17.0.1 is the docker0 bridge gateway (host) accessible from bridge-networked containers
    location /nb-api/ {
        proxy_pass http://172.17.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5;
        proxy_read_timeout 120;
    }
    # noVNC - HTML5 VNC client for Linux host desktop access
    # noVNC/websockify runs on host network at port 6080
    # Serves static noVNC files and proxies WebSocket connections to VMs
    location /novnc/ {
        proxy_pass http://172.17.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # WebSocket endpoint for noVNC/websockify VNC proxy
    location /websockify/ {
        proxy_pass http://172.17.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # VeloCloud Orchestrator Web UI proxy
    # VCO uses fixed management IP 192.168.0.6 (reserved in management subnet)
    # This mirrors the CVP pattern at 192.168.0.5
    #
    # VCO paths include: /portal/, /api/, /sdwan/, /vco/ (UI entry point),
    # and static assets at /assets/, /branding/
    #
    # The /vco/ location handles the main UI entry point
    # The regex location below handles VCO-specific API/asset paths
    location /vco/ {
        proxy_pass https://192.168.0.6/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;

        # Disable compression from upstream so sub_filter can work
        # sub_filter cannot process gzip'd content
        proxy_set_header Accept-Encoding "";

        # Rewrite redirect Location headers from upstream
        # VCO redirects to /login, /portal/, etc. which need /vco/ prefix
        proxy_redirect / /vco/;
        proxy_redirect https://192.168.0.6/ /vco/;

        # WebSocket support for VCO UI
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for slow responses
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;

        # Rewrite absolute paths in HTML/JS responses to use /vco/ prefix
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter_once off;
        sub_filter '"/assets/' '"/vco/assets/';
        sub_filter "'/assets/" "'/vco/assets/";
        sub_filter '"/branding/' '"/vco/branding/';
        sub_filter "'/branding/" "'/vco/branding/";
        sub_filter '"/portal/' '"/vco/portal/';
        sub_filter "'/portal/" "'/vco/portal/";
        sub_filter '"/api/' '"/vco/api/';
        sub_filter "'/api/" "'/vco/api/";
        sub_filter '"/sdwan/' '"/vco/sdwan/';
        sub_filter "'/sdwan/" "'/vco/sdwan/";
        sub_filter '"/rest/' '"/vco/rest/';
        sub_filter "'/rest/" "'/vco/rest/";
        sub_filter '"/login' '"/vco/login';
        sub_filter "'/login" "'/vco/login";
        sub_filter '"/css/' '"/vco/css/';
        sub_filter "'/css/" "'/vco/css/";
        sub_filter '"/js/' '"/vco/js/';
        sub_filter "'/js/" "'/vco/js/";
    }
    location = /firefox {return 301 $scheme://$http_host/firefox/;}
    location /firefox/ {
        proxy_pass http://atd-webui:5800/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === WebSocket Support Headers ===
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400; # Keep connection open
    }
    location ~ ^/(grpc-web/arista\..*|arista\..*) {
        grpc_pass grpcs://192.168.0.5:443;
        grpc_ssl_verify off;
        grpc_read_timeout 14400;
        grpc_send_timeout 14400;
        client_body_timeout 14400;
    }
    location ~ ^/(cv|wifi/aware/|grpc-web|cvpservice|static|api|web|assets) {
        proxy_pass https://192.168.0.5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_read_timeout  90;
        client_max_body_size 800M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
  }
